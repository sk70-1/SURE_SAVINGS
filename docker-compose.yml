version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sure_savings_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sure_savings
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sure_savings_api
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/sure_savings
      - SECRET_KEY=prod_super_secret_sure_savings_key_change_via_env
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - DEMO_MODE_ENABLED=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sure_savings_web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  postgres_data:
