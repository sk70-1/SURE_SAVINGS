services:
  # 1. FastAPI Backend Service
  - type: web
    name: sure-savings-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sure-savings-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DEMO_MODE_ENABLED
        value: "true"

  # 2. Next.js Frontend Service
  - type: web
    name: sure-savings-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NEXT_PUBLIC_API_URL
        value: https://sure-savings-api-ll73.onrender.com/api/v1

databases:
  # 3. Managed PostgreSQL Database
  - name: sure-savings-db
    plan: free
    databaseName: sure_savings
    user: sure_savings_user
